repair_energy_statistics:
  fields:
    entity_id:
      selector:
        entity:
          multiple: true
          filter:
            domain: sensor
    start:
      selector:
        datetime:
    max_change_per_hour:
      selector:
        number:
          min: 0.1
          max: 1000000
          step: 0.1
          mode: box
    dry_run:
      default: true
      selector:
        boolean:
